name: Daily Finance Notifications

on:
  schedule:
    - cron: '30 2 * * *'  # 08:00 AM IST (UTC+5:30) — India has no DST, always fixed
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send to this email only for testing (leave blank for all users)'
        required: false
        type: string

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Send daily digest notifications
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          VITE_ENCRYPTION_SALT: ${{ secrets.VITE_ENCRYPTION_SALT }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: cd scripts && node send-notifications.js
