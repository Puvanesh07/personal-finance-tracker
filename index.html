<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>WealthTrack | Personal Portfolio</title>
    
    <style>
      /* Prevents harsh white flashes before React and Tailwind load */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #f8fafc; /* Tailwind slate-50 */
      }
      /* Fallback for system dark mode users before the app sets the explicit theme */
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #020617; /* Tailwind slate-950 */
        }
      }
    </style>
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
